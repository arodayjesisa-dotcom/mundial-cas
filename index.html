<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mundial CAS 2026 - Resultados en Vivo</title>
    <style>
        :root {
            --azul-fondo: #0033a0;
            --azul-oscuro: #001f5c;
            --verde-neon: #a3e000;
            --azul-brillante: #0056ff;
            --blanco: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px; 
            background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul-fondo) 100%); 
            color: var(--blanco); 
            min-height: 100vh;
        }

        h1, h2 { text-align: center; color: var(--blanco); text-transform: uppercase; }
        h1 { border-bottom: 3px solid var(--verde-neon); padding-bottom: 10px; }
        .actualizacion { text-align: center; color: var(--verde-neon); font-size: 0.9em; margin-bottom: 20px; }

        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
        .grupo-seccion { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 20px; border-radius: 15px; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(0, 0, 0, 0.2); border-radius: 10px; overflow: hidden; }
        th { background-color: var(--azul-brillante); color: white; padding: 12px; }
        td { padding: 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .flag { width: 24px; height: 16px; margin-right: 8px; vertical-align: middle; }

        .jornada-titulo { 
            font-weight: bold; color: var(--verde-neon); 
            margin-top: 20px; padding-bottom: 5px;
            border-bottom: 1px solid var(--verde-neon);
        }

        .partido-fila { 
            display: grid; 
            grid-template-columns: 1.5fr 60px 30px 60px 1.5fr; 
            gap: 10px; align-items: center; 
            margin: 10px 0; padding: 10px; 
            background: rgba(255,255,255,0.1); border-radius: 8px; 
        }

        input[readonly] { 
            width: 50px; padding: 6px; border-radius: 4px; border: none; 
            text-align: center; font-weight: bold;
            background: rgba(255,255,255,0.9); color: #333;
            cursor: default;
        }

        .fase-final { margin-top: 50px; display: flex; flex-direction: column; gap: 20px; }
        .llave-columna { flex: 1; min-width: 280px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border-top: 4px solid var(--verde-neon); }
        
        .match-card { 
            background: rgba(255,255,255,0.05); 
            margin-bottom: 15px; padding: 15px; 
            border-radius: 8px; border-left: 4px solid var(--azul-brillante);
        }

        #campeon-anuncio { 
            text-align: center; font-size: 2em; color: var(--verde-neon); 
            margin-top: 30px; padding: 20px; 
            border: 5px solid var(--verde-neon); border-radius: 20px; 
            background: rgba(0,0,0,0.5); display: none;
        }

        #loading { text-align: center; font-size: 1.5em; margin-top: 100px; }
    </style>
</head>
<body>

    <div id="loading">⚽ Cargando resultados oficiales...</div>

    <div class="container" id="content" style="display:none">
        <h1>🏆 MUNDIAL CAS 2026</h1>
        <div class="actualizacion">● MODO ESPECTADOR (SOLO LECTURA)</div>
        
        <div id="grupos-container"></div>

        <div class="fase-final">
            <h2>🔥 FASE DE ELIMINACIÓN DIRECTA</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
                <div class="llave-columna"><h3>Cuartos</h3><div id="cuartos-lista"></div></div>
                <div class="llave-columna"><h3>Semis</h3><div id="semis-lista"></div></div>
                <div class="llave-columna"><h3>Final</h3><div id="final-lista"></div></div>
            </div>
            <div id="campeon-anuncio"></div>
        </div>
    </div>

<script>
    // --- CONFIGURACIÓN ---
    const API_URL = "https://script.google.com/macros/s/AKfycbyAIx2OM2UD4vxVJyzr1bxlIgKasZ3SNfGUiE0wX2ZC0xb05qP7f0FPyUtO5JBuXG0/exec"; 

    const banderas = {
        "España (4to C)": "es", "Inglaterra (3ero B)": "gb-eng", "Colombia (3ero A)": "co", "Japón (5to B)": "jp", "USA (Prof)": "us",
        "Marruecos (3ero C)": "ma", "Argentina (5to A)": "ar", "Brasil (4to B)": "br", "Italia (5to C)": "it", "Alemania (4to A)": "de",
        "Bélgica (2do C)": "be", "Francia (2do B)": "fr", "Portugal (2do A)": "pt", "Uruguay (1ero)": "uy"
    };

    const grupos = {
        A: ["España (4to C)", "Inglaterra (3ero B)", "Colombia (3ero A)", "Japón (5to B)", "USA (Prof)"],
        B: ["Marruecos (3ero C)", "Argentina (5to A)", "Brasil (4to B)", "Italia (5to C)", "Alemania (4to A)"],
        C: ["Bélgica (2do C)", "Francia (2do B)", "Portugal (2do A)", "Uruguay (1ero)"]
    };

    const partidosDefinidos = [
        { grupo: 'A', jornada: 1, eq1: "Inglaterra (3ero B)", eq2: "Japón (5to B)" },
        { grupo: 'A', jornada: 1, eq1: "España (4to C)", eq2: "USA (Prof)" },
        { grupo: 'A', jornada: 2, eq1: "España (4to C)", eq2: "Japón (5to B)" },
        { grupo: 'A', jornada: 2, eq1: "Colombia (3ero A)", eq2: "USA (Prof)" },
        { grupo: 'A', jornada: 3, eq1: "España (4to C)", eq2: "Colombia (3ero A)" },
        { grupo: 'A', jornada: 3, eq1: "Inglaterra (3ero B)", eq2: "USA (Prof)" },
        { grupo: 'A', jornada: 4, eq1: "Japón (5to B)", eq2: "Colombia (3ero A)" },
        { grupo: 'A', jornada: 4, eq1: "España (4to C)", eq2: "Inglaterra (3ero B)" },
        { grupo: 'A', jornada: 5, eq1: "Inglaterra (3ero B)", eq2: "Colombia (3ero A)" },
        { grupo: 'A', jornada: 5, eq1: "USA (Prof)", eq2: "Japón (5to B)" },
        { grupo: 'B', jornada: 1, eq1: "Argentina (5to A)", eq2: "Italia (5to C)" },
        { grupo: 'B', jornada: 1, eq1: "Marruecos (3ero C)", eq2: "Alemania (4to A)" },
        { grupo: 'B', jornada: 2, eq1: "Marruecos (3ero C)", eq2: "Italia (5to C)" },
        { grupo: 'B', jornada: 2, eq1: "Brasil (4to B)", eq2: "Alemania (4to A)" },
        { grupo: 'B', jornada: 3, eq1: "Italia (5to C)", eq2: "Alemania (4to A)" },
        { grupo: 'B', jornada: 3, eq1: "Brasil (4to B)", eq2: "Argentina (5to A)" },
        { grupo: 'B', jornada: 4, eq1: "Argentina (5to A)", eq2: "Alemania (4to A)" },
        { grupo: 'B', jornada: 4, eq1: "Brasil (4to B)", eq2: "Marruecos (3ero C)" },
        { grupo: 'B', jornada: 5, eq1: "Brasil (4to B)", eq2: "Italia (5to C)" },
        { grupo: 'B', jornada: 5, eq1: "Marruecos (3ero C)", eq2: "Argentina (5to A)" },
        { grupo: 'C', jornada: 1, eq1: "Bélgica (2do C)", eq2: "Uruguay (1ero)" },
        { grupo: 'C', jornada: 1, eq1: "Francia (2do B)", eq2: "Portugal (2do A)" },
        { grupo: 'C', jornada: 2, eq1: "Bélgica (2do C)", eq2: "Portugal (2do A)" },
        { grupo: 'C', jornada: 2, eq1: "Uruguay (1ero)", eq2: "Francia (2do B)" },
        { grupo: 'C', jornada: 3, eq1: "Bélgica (2do C)", eq2: "Francia (2do B)" },
        { grupo: 'C', jornada: 3, eq1: "Uruguay (1ero)", eq2: "Portugal (2do A)" }
    ];

    let datosGlobales = {};
    let clasificadosFinales = { A: [], B: [], C: [] };
    let tercerosOrdenados = [];

    async function cargarMundial() {
        try {
            const res = await fetch(API_URL);
            datosGlobales = await res.json();
            renderizarTodo();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        } catch (e) {
            document.getElementById('loading').innerText = "Error al conectar con la base de datos.";
        }
    }

    const getFlag = (n) => n && n !== "?" ? `<img src="https://flagcdn.com/w40/${banderas[n] || 'un'}.png" class="flag">` : "";

    function renderizarTodo() {
        const container = document.getElementById('grupos-container');
        container.innerHTML = "";

        ['A', 'B', 'C'].forEach(letra => {
            const sec = document.createElement('div'); sec.className = "grupo-seccion";
            sec.innerHTML = `<h2>GRUPO ${letra}</h2><table id="tabla-${letra}"><thead><tr><th>Pos</th><th style="text-align:left">Equipo</th><th>PTS</th><th>PJ</th><th>DG</th></tr></thead><tbody></tbody></table><div id="partidos-${letra}"></div>`;
            container.appendChild(sec);

            // Calcular Estadísticas
            let stats = {}; grupos[letra].forEach(e => stats[e] = { pts:0, pj:0, gf:0, dg:0 });
            const partidos = partidosDefinidos.filter(p => p.grupo === letra);
            const jornadas = [...new Set(partidos.map(p => p.jornada))].sort((a,b)=>a-b);

            let htmlPartidos = "";
            jornadas.forEach(j => {
                htmlPartidos += `<div class="jornada-titulo">Jornada ${j}</div>`;
                partidos.filter(p => p.jornada === j).forEach((p, idx) => {
                    const id = `g_${letra}_j_${j}_p_${idx}`;
                    const g1 = datosGlobales[id]?.g1 ?? "";
                    const g2 = datosGlobales[id]?.g2 ?? "";

                    if(g1 !== "" && g2 !== "") {
                        const n1 = parseInt(g1), n2 = parseInt(g2);
                        stats[p.eq1].pj++; stats[p.eq2].pj++;
                        stats[p.eq1].dg += (n1 - n2); stats[p.eq2].dg += (n2 - n1);
                        if(n1 > n2) stats[p.eq1].pts += 3; else if(n2 > n1) stats[p.eq2].pts += 3; else { stats[p.eq1].pts+=1; stats[p.eq2].pts+=1; }
                    }

                    htmlPartidos += `
                        <div class="partido-fila">
                            <span style="text-align:right">${getFlag(p.eq1)} ${p.eq1}</span>
                            <input type="number" value="${g1}" readonly>
                            <span style="color:var(--verde-neon)">vs</span>
                            <input type="number" value="${g2}" readonly>
                            <span style="text-align:left">${getFlag(p.eq2)} ${p.eq2}</span>
                        </div>`;
                });
            });
            document.getElementById(`partidos-${letra}`).innerHTML = htmlPartidos;

            let lista = Object.keys(stats).map(n => ({ nombre: n, ...stats[n] })).sort((a,b) => b.pts - a.pts || b.dg - a.dg);
            clasificadosFinales[letra] = lista;
            const tbody = document.querySelector(`#tabla-${letra} tbody`);
            lista.forEach((e, i) => {
                tbody.innerHTML += `<tr><td>${i+1}</td><td style="text-align:left">${getFlag(e.nombre)} ${e.nombre}</td><td>${e.pts}</td><td>${e.pj}</td><td>${e.dg>=0?'+'+e.dg:e.dg}</td></tr>`;
            });
        });

        procesarFaseFinal();
    }

    function procesarFaseFinal() {
        const terceros = [clasificadosFinales.A[2], clasificadosFinales.B[2], clasificadosFinales.C[2]].sort((a,b)=>b.pts-a.pts || b.dg-a.dg);
        
        const llaves = {
            C1: { n1: clasificadosFinales.A[0].nombre, n2: terceros[1]?.nombre, id: "final_C1" },
            C2: { n1: clasificadosFinales.B[0].nombre, n2: terceros[0]?.nombre, id: "final_C2" },
            C3: { n1: clasificadosFinales.C[0].nombre, n2: clasificadosFinales.B[1]?.nombre, id: "final_C3" },
            C4: { n1: clasificadosFinales.A[1]?.nombre, n2: clasificadosFinales.C[1]?.nombre, id: "final_C4" }
        };

        const resolverLlave = (idLlave, team1, team2) => {
            const g1 = datosGlobales[idLlave]?.g1 ?? "";
            const g2 = datosGlobales[idLlave]?.g2 ?? "";
            let ganador = null;
            if(g1 !== "" && g2 !== "") ganador = (parseInt(g1) > parseInt(g2)) ? team1 : team2;
            return { g1, g2, ganador };
        };

        // Render Cuartos
        let htmlC = "";
        Object.keys(llaves).forEach(k => {
            const res = resolverLlave(k, llaves[k].n1, llaves[k].n2);
            llaves[k].ganador = res.ganador;
            htmlC += `<div class="match-card"><strong>${k}:</strong><br>${getFlag(llaves[k].n1)} ${llaves[k].n1} <input type="number" value="${res.g1}" readonly> vs <input type="number" value="${res.g2}" readonly> ${getFlag(llaves[k].n2)} ${llaves[k].n2}</div>`;
        });
        document.getElementById('cuartos-lista').innerHTML = htmlC;

        // Semis
        const s1Res = resolverLlave("S1", llaves.C1.ganador, llaves.C3.ganador);
        const s2Res = resolverLlave("S2", llaves.C2.ganador, llaves.C4.ganador);
        document.getElementById('semis-lista').innerHTML = `
            <div class="match-card"><strong>S1:</strong><br>${getFlag(llaves.C1.ganador)} ${llaves.C1.ganador || "?"} <input type="number" value="${s1Res.g1}" readonly> vs <input type="number" value="${s1Res.g2}" readonly> ${getFlag(llaves.C3.ganador)} ${llaves.C3.ganador || "?"}</div>
            <div class="match-card"><strong>S2:</strong><br>${getFlag(llaves.C2.ganador)} ${llaves.C2.ganador || "?"} <input type="number" value="${s2Res.g1}" readonly> vs <input type="number" value="${s2Res.g2}" readonly> ${getFlag(llaves.C4.ganador)} ${llaves.C4.ganador || "?"}</div>`;

        // Final
        const fRes = resolverLlave("F", s1Res.ganador, s2Res.ganador);
        document.getElementById('final-lista').innerHTML = `
            <div class="match-card" style="border-left-color:var(--verde-neon)"><strong>FINAL:</strong><br>${getFlag(s1Res.ganador)} ${s1Res.ganador || "?"} <input type="number" value="${fRes.g1}" readonly> vs <input type="number" value="${fRes.g2}" readonly> ${getFlag(s2Res.ganador)} ${s2Res.ganador || "?"}</div>`;

        if(fRes.ganador) {
            const anc = document.getElementById('campeon-anuncio');
            anc.innerHTML = `🏆 ¡${fRes.ganador.toUpperCase()} CAMPEÓN! 🏆`;
            anc.style.display = "block";
        }
    }

    window.onload = cargarMundial;
</script>
</body>
</html>
